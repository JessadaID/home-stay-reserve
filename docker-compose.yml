version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: homestay_postgres
    restart: always
    environment:
      POSTGRES_USER: jessada
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: homestay_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
